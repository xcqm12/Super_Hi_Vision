name: Build & Release

# 推送 v* 标签（如 v1.5.23）时触发：自动打包 exe + NSIS 安装包并发布正式版
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # GitHub Windows runner 的控制台代码页是 cp1252，PyInstaller 打印含中文的日志行
      # （版本资源里的 ProductName 等）会抛 UnicodeEncodeError 秒退，必须强制 UTF-8
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      # 打包时必须带上内置 FFmpeg，缺了就让构建失败（别发出没声音的 exe）
      SHV_REQUIRE_FFMPEG: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 最早的预检：任何被误提交的凭据都在这里拦下，而不是等打完包才发现
      # 脚本只报「文件 + 命中类型」，不回显命中内容，避免把凭据写进 CI 日志
      - name: 预检：无凭据泄漏
        shell: pwsh
        run: |
          python tools\check_no_secrets.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # PyInstaller 钉 6.22.2：6.22.3 在 PyQt5 钩子阶段会硬崩（无 traceback），本地/CI 均可复现
          pip install "pyinstaller==6.22.2" PyQt5 opencv-python pillow numpy pyaudio pynput

      - name: Download FFmpeg (win64 static)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          foreach ($f in @("ffmpeg.exe", "ffplay.exe", "ffprobe.exe")) {
            Get-ChildItem -Path "ffmpeg_extract" -Recurse -Filter $f | Select-Object -First 1 |
              ForEach-Object { Copy-Item $_.FullName -Destination ("ffmpeg\" + $f) -Force }
          }
          $missing = @("ffmpeg\ffmpeg.exe", "ffmpeg\ffplay.exe", "ffmpeg\ffprobe.exe") | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "缺少 FFmpeg 文件: $missing"; exit 1 }
          Get-ChildItem ffmpeg | Select-Object Name, Length

      - name: 预检：依赖可导入
        shell: pwsh
        run: |
          python tools\ci_preflight.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm SuperHiVision.spec 2>&1 | Tee-Object -FilePath pyi.log
          if ($LASTEXITCODE -ne 0) {
            $lines = @(Get-Content pyi.log)
            $hit = ($lines | Select-String -Pattern 'Traceback|ERROR:|Fatal|error:' | Select-Object -Last 1)
            if ($hit) { $start = [Math]::Max(0, $hit.LineNumber - 1) }
            else { $start = [Math]::Max(0, $lines.Count - 10) }
            $sel = $lines[$start..([Math]::Min($start + 9, $lines.Count - 1))]
            foreach ($l in $sel) { Write-Output ("::error title=PyI::{0}" -f $l) }
            exit 1
          }
          # 产物名随源码 __version__ 变化，这里不写死版本号
          $built = Get-ChildItem -Path "dist\SuperHiVision_v*.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $built) {
            Write-Output "::error title=PyI::dist 下没有产出 SuperHiVision_v*.exe"
            exit 1
          }
          Write-Host "built: $($built.Name)"

      # ---- 代码签名（可选）：仓库配了签名证书 secrets 才会执行，否则自动跳过 ----
      # 自签名证书只能让「装了这张证书的机器」不再显示未知发布者；要让所有下载者
      # 都不再看到警告，需要商业 CA 签发的代码签名证书。详见 docs/CODE_SIGNING.md
      - name: Import signing certificate (optional)
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64) {
            Write-Host 'no SIGNING_PFX_BASE64 secret configured - binaries will stay unsigned'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'shv-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $pw = ConvertTo-SecureString -String $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          $cer = Join-Path $env:RUNNER_TEMP 'shv-signing.cer'
          Export-Certificate -Cert $cert -FilePath $cer -Force | Out-Null
          try {
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root -ErrorAction Stop | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher -ErrorAction Stop | Out-Null
            Write-Host 'certificate trusted in LocalMachine stores'
          } catch {
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\Root -ErrorAction Stop | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\TrustedPublisher -ErrorAction Stop | Out-Null
            Write-Host 'certificate trusted in CurrentUser stores'
          }
          "SHV_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "signing certificate ready: $($cert.Thumbprint)"

      - name: Sign the green exe (optional)
        shell: pwsh
        run: |
          if (-not $env:SHV_SIGN_THUMBPRINT) { Write-Host 'no signing certificate - skipped'; exit 0 }
          $ver = (Select-String -Path Super_Hi_Vision_PyQt.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          pwsh -NoProfile -File tools\sign_binaries.ps1 -Path "dist\SuperHiVision_v$ver.exe" -Thumbprint $env:SHV_SIGN_THUMBPRINT -NoBackup
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      # installer.nsi 中的 File 指令引用工作区根目录的 exe，需先从 dist 复制到根目录
      - name: Prepare NSIS input files
        shell: pwsh
        run: |
          $built = Get-ChildItem -Path "dist\SuperHiVision_v*.exe" | Select-Object -First 1
          if (-not $built) { Write-Error "dist 下没有 SuperHiVision_v*.exe"; exit 1 }
          Copy-Item -Path $built.FullName -Destination $built.Name -Force
          Get-ChildItem $built.Name | Select-Object Name, Length

      - name: Build NSIS installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Sign the installer (optional)
        shell: pwsh
        run: |
          if (-not $env:SHV_SIGN_THUMBPRINT) { Write-Host 'no signing certificate - skipped'; exit 0 }
          $ver = (Select-String -Path Super_Hi_Vision_PyQt.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          pwsh -NoProfile -File tools\sign_binaries.ps1 -Path "SuperHiVision_Setup_v$ver.exe" -Thumbprint $env:SHV_SIGN_THUMBPRINT -NoBackup
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperHiVision-${{ github.ref_name }}
          path: |
            dist/SuperHiVision_v*.exe
            SuperHiVision_Setup_v*.exe

      - name: Create GitHub Release (正式版)
        uses: softprops/action-gh-release@v2
        with:
          name: "Super Hi Vision ${{ github.ref_name }} 正式版"
          body: |
            ## Super Hi Vision ${{ github.ref_name }} 正式版

            ### 🆕 本次更新（${{ github.ref_name }}）
            - 🔤 **修复 FFmpeg 路径显示成大写后缀（`ffmpeg.EXE`）**：程序按小写 `ffmpeg.exe` 查找，Windows 不区分大小写所以能命中，但回显的是磁盘上的原始拼写，于是状态栏显示 `.EXE`、下发给 FFmpeg 的命令行也带着大写；现在统一按规范小写回填，显示与调用都稳定
            - 🧩 **顺手兼容文件名的各种写法**：`FFMPEG.EXE` / `Ffmpeg.Exe`，以及用户解压后自行改名成 `ffmpeg-n7.1-essentials.exe` 这类变体（同目录宽容匹配）；不再把 `ffplay.exe` 误当成 ffmpeg
            - 🧪 **新增回归测试** `tools/verify_ffmpeg_case.py`：直接对源码里的真实方法做 8 项断言（大写/全大写/混合/正常/改名变体/缺失/无关 exe/坏文件），全部通过
            - 🔐 **新增凭据泄漏检查** `tools/check_no_secrets.py`：打包前扫描会被提交的文件，命中凭据特征就失败
            - 🪪 **发行者与代码签名**：exe / 安装包属性里发行者固定为 SevenZeroMeowTeam，并支持 CI 自动签名（配好 secrets 即生效，未配则自动跳过）
            - 🎚️ 保留 1.5.23 的内置 FFmpeg、降噪强度滑杆、托盘保活、二次点击唤出窗口、静默合成与保存崩溃修复

            ### 📦 包含内容
            - **SuperHiVision_${{ github.ref_name }}.exe** — 单文件绿色版（内置 FFmpeg，拷到任意目录都能用）
            - **SuperHiVision_Setup_${{ github.ref_name }}.exe** — NSIS 完整安装包（自动创建桌面/开始菜单快捷方式）

            ### 🚀 使用说明
            - **绿色版**：直接双击即可运行（FFmpeg 已内置，无需额外放 ffmpeg 文件夹）
            - **安装包**：安装到 `Program Files`，更规范，支持卸载

            ### ✅ 环境要求
            - Windows 10 / 11 64 位
            - 无需安装 Python / VC++ 运行库（已内置）
          files: |
            dist/SuperHiVision_v*.exe
            SuperHiVision_Setup_v*.exe
          draft: false
          prerelease: false
