name: Build & Release

# 推送 v* 标签（如 v1.5.10）时触发：自动打包 exe + NSIS 安装包并发布正式版
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt5 opencv-python pillow numpy pyaudio

      - name: Download FFmpeg (win64 static)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Get-ChildItem "ffmpeg_extract\*\bin\ffmpeg.exe", "ffmpeg_extract\*\bin\ffplay.exe", "ffmpeg_extract\*\bin\ffprobe.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination "ffmpeg\" -Force }
          Get-ChildItem ffmpeg | Select-Object Name, Length

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm SuperHiVision.spec

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperHiVision-${{ github.ref_name }}
          path: |
            dist/SuperHiVision_v1.5.10.exe
            SuperHiVision_Setup_v1.5.10.exe

      - name: Create GitHub Release (正式版)
        uses: softprops/action-gh-release@v2
        with:
          name: "Super Hi Vision ${{ github.ref_name }} 正式版"
          body: |
            ## Super Hi Vision ${{ github.ref_name }} 正式版

            ### 📦 包含内容
            - **SuperHiVision_v1.5.10.exe** — 单文件绿色版（约 95MB，无需安装 Python）
            - **SuperHiVision_Setup_v1.5.10.exe** — NSIS 完整安装包（含 FFmpeg，自动创建桌面/开始菜单快捷方式）

            ### 🚀 使用说明
            - **绿色版**：直接双击即可运行
            - **安装包**：安装到 `Program Files`，更规范，支持卸载

            ### ✅ 环境要求
            - Windows 10 / 11 64 位
            - 无需安装 Python / VC++ 运行库（已内置）
          files: |
            dist/SuperHiVision_v1.5.10.exe
            SuperHiVision_Setup_v1.5.10.exe
          draft: false
          prerelease: false
