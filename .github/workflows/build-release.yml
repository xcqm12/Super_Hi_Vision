name: Build & Release

# 推送 v* 标签（如 v1.5.23）时触发：自动打包 exe + NSIS 安装包并发布正式版
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt5 opencv-python pillow numpy pyaudio pynput

      - name: Download FFmpeg (win64 static)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          foreach ($f in @("ffmpeg.exe", "ffplay.exe", "ffprobe.exe")) {
            Get-ChildItem -Path "ffmpeg_extract" -Recurse -Filter $f | Select-Object -First 1 |
              ForEach-Object { Copy-Item $_.FullName -Destination ("ffmpeg\" + $f) -Force }
          }
          $missing = @("ffmpeg\ffmpeg.exe", "ffmpeg\ffplay.exe", "ffmpeg\ffprobe.exe") | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "缺少 FFmpeg 文件: $missing"; exit 1 }
          Get-ChildItem ffmpeg | Select-Object Name, Length

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm SuperHiVision.spec

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      # installer.nsi 中的 File 指令引用工作区根目录的 exe，需先从 dist 复制到根目录
      - name: Prepare NSIS input files
        shell: pwsh
        run: |
          Copy-Item -Path "dist/SuperHiVision_v1.5.23.exe" -Destination "SuperHiVision_v1.5.23.exe" -Force
          Get-ChildItem "SuperHiVision_v1.5.23.exe" | Select-Object Name, Length

      - name: Build NSIS installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperHiVision-${{ github.ref_name }}
          path: |
            dist/SuperHiVision_v1.5.23.exe
            SuperHiVision_Setup_v1.5.23.exe

      - name: Create GitHub Release (正式版)
        uses: softprops/action-gh-release@v2
        with:
          name: "Super Hi Vision ${{ github.ref_name }} 正式版"
          body: |
            ## Super Hi Vision ${{ github.ref_name }} 正式版

            ### 🆕 本次更新（v1.5.23）
            - 📦 **FFmpeg 内置进单文件 exe**：绿色版拷到任意目录都能合成音频，不再出现「有画面无声音」（不再分发 ffplay，省约 150MB）
            - 🐛 **修复「有画面无声音」**：根因是绿色版 exe 不带 FFmpeg，单独拷到别处后音视频合成失败；旧提示既没说清该放哪，也没保住录到的音频
            - 🔎 **查找范围加宽**：外置 ffmpeg\ → 内置 → bin\ → 上一级 → %LOCALAPPDATA% → C:\\ffmpeg\\bin / scoop / choco → 注册表 → PATH；结果缓存
            - 🔊 **失败也不丢音频**：合并失败时把 WAV 另存为 `xxx.audio.wav` 并给出路径
            - 🧾 **原因明确**：区分「未找到 FFmpeg」（给出确切该放的路径）与「FFmpeg 报错」（附错误尾部），现场写入 error.log
            - ✅ **新增「检查 FFmpeg」自检**：高级设置页常驻状态 + 一键重新探测
            - 🎚️ 保留 1.5.23 的降噪强度滑杆、托盘保活、二次点击唤出窗口、静默合成与保存崩溃修复

            ### 📦 包含内容
            - **SuperHiVision_v1.5.23.exe** — 单文件绿色版（内置 FFmpeg，拷到任意目录都能用）
            - **SuperHiVision_Setup_v1.5.23.exe** — NSIS 完整安装包（自动创建桌面/开始菜单快捷方式）

            ### 🚀 使用说明
            - **绿色版**：直接双击即可运行（FFmpeg 已内置，无需额外放 ffmpeg 文件夹）
            - **安装包**：安装到 `Program Files`，更规范，支持卸载

            ### ✅ 环境要求
            - Windows 10 / 11 64 位
            - 无需安装 Python / VC++ 运行库（已内置）
          files: |
            dist/SuperHiVision_v1.5.23.exe
            SuperHiVision_Setup_v1.5.23.exe
          draft: false
          prerelease: false
